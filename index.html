<!doctype html>
<html lang="en" style="background: lab(70.024 -1.25023 -9.22515)">
	<head>
		<meta charset="utf-8" />
		<title>Balance Mender</title>
		<meta
			name="description"
			content="A tactical healing game for the web. Heal the people with you, and rebuild any ability, enemy or number you like."
		/>
		<meta
			name="viewport"
			content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, shrink-to-fit=no"
		/>
		<link href="/favicon.jpg" rel="icon" type="image/x-icon" />
		<link rel="manifest" href="pwa.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.bunny.net" />
		<link href="https://fonts.bunny.net/css?family=proza-libre:400,400i,700|rubik-80s-fade:400" rel="stylesheet" />
		<!-- Linked, not imported from main.ts: a JS-injected stylesheet paints the raw markup first. -->
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<div class="Splash">
			<div class="Splash-bg"></div>
			<div class="Splash-content">
				<h1 class="Splash-title">
					<span class="Splash-titleLine">Balance</span>
					<span class="Splash-titleLine">Mender</span>
				</h1>
				<!-- Filled by main.ts with the dungeon-select buttons. -->
				<div class="Splash-prompt"></div>
			</div>
		</div>

		<div class="AppChrome" style="opacity: 0">
			<div class="AppChrome-menu" id="menu"></div>
			<!-- Not id="balancemender": that would shadow window.balancemender, the console's handle on the game. -->
			<div class="AppChrome-game" id="game"></div>
		</div>

		<!-- data-dock picks which edge rail a panel lands in on a fresh visit; see applyDefaultLayout() -->
		<floating-view data-view-id="balance-lab" data-dock="left" minimized style="width: 36rem">
			<header>Balance Lab</header>
			<main>
				<balance-lab></balance-lab>
			</main>
		</floating-view>

		<floating-view data-view-id="dev-console" data-dock="left" minimized>
			<header>Console</header>
			<main>
				<dev-console></dev-console>
			</main>
		</floating-view>

		<floating-view data-view-id="combat-log" data-dock="right" style="height: 11rem">
			<header>Combat log</header>
			<main>
				<combat-log-viewer></combat-log-viewer>
			</main>
		</floating-view>

		<floating-view data-view-id="fight-report" data-dock="right" style="width: 28rem; height: 20rem">
			<header>Fight report</header>
			<main>
				<fight-report></fight-report>
			</main>
		</floating-view>

		<floating-view data-view-id="animation-debugger" data-dock="left" minimized>
			<header>Animation</header>
			<main>
				<animation-debugger></animation-debugger>
			</main>
		</floating-view>

		<!-- <floating-view data-view-id="color-palette" data-dock="left" minimized> -->
		<!-- 	<header>Color Palette</header> -->
		<!-- 	<main> -->
		<!-- 		<color-palette></color-palette> -->
		<!-- 	</main> -->
		<!-- </floating-view> -->

		<p style="position: fixed; right: 1em; bottom: 0.5em">
			<a href="https://github.com/oskarrough/balancemender" rel="noreferrer" target="_blank" style="color: inherit"
				>source</a
			>
		</p>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
